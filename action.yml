name: product-engineer check
description: Fails a pull request whose description has no "For the customer" block, and warns on the rest.
author: Efe Genc
branding:
  icon: check-square
  color: blue
inputs:
  pr:
    description: Pull request number to check. Defaults to the event's pull request.
    required: false
    default: ${{ github.event.pull_request.number }}
  warn:
    description: Set to "true" to report a missing block as a warning instead of failing.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Check the pull request description
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        ACTION_PATH: ${{ github.action_path }}
        PR_NUMBER: ${{ inputs.pr }}
        WARN: ${{ inputs.warn }}
      run: |
        case "$PR_NUMBER" in
          ''|*[!0-9]*) echo "pr must be a number, got: $PR_NUMBER" >&2; exit 2 ;;
        esac
        if [ "$WARN" = "true" ]; then
          node "$ACTION_PATH/bin/check.mjs" check --pr "$PR_NUMBER" --warn
        else
          node "$ACTION_PATH/bin/check.mjs" check --pr "$PR_NUMBER"
        fi
