name: Feature request
description: Something the check, an integration, an adapter or the install path should do
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: outcome
    attributes:
      label: What you would be able to do
      description: One or two sentences, in your words, as the skill asks. Who gets what, and how they notice.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What you do today instead
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - product-engineer check (CLI or action)
        - commitlint, pre-commit, lefthook or husky integration
        - a generated adapter (Cursor, Copilot, Gemini, Cline, Kiro, Windsurf, AGENTS.md)
        - install path or documentation
        - evaluation harness
        - other
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: A rule change goes through the "Rule proposal" form instead; it needs a before/after pair.
