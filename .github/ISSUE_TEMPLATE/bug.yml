name: Bug
description: The skill, the hook, or an install path does not do what the README says
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent and version
      placeholder: "Claude Code 2.1, Codex, Cursor, other"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install method
      options:
        - npx skills add
        - plugin
        - by hand
    validations:
      required: true
  - type: textarea
    id: commands
    attributes:
      label: Commands run
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      render: shell
