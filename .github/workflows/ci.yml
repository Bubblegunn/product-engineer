name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm test
  package:
    # The tarball people install, checked before a tag exists: files, bin, and a real install.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx publint --strict
      - name: Install the packed tarball in an empty project and run it
        run: sh scripts/smoke-tarball.sh
  release-gate:
    # The version the package states is the version every other file states, and npm pack ships only allowlisted paths.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build --if-present
      - run: node scripts/release-gate.mjs
  baseline:
    # The measured claim in evals/baseline/RESULTS.md, regenerated from the history in this
    # checkout. A stale table is a claim nobody checked, so it fails the build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: The committed results match a fresh run
        run: |
          node evals/baseline/run.mjs --commits 200
          git diff --exit-code -- evals/baseline/RESULTS.md
  ci-ok:
    # The one check the branch ruleset requires; it fails if any job above failed or was cancelled.
    if: always()
    needs: [test, package, release-gate, baseline]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "test: ${{ needs.test.result }}  package: ${{ needs.package.result }}  release-gate: ${{ needs.release-gate.result }}  baseline: ${{ needs.baseline.result }}"
          test "${{ needs.test.result }}" = success && test "${{ needs.package.result }}" = success && test "${{ needs.release-gate.result }}" = success && test "${{ needs.baseline.result }}" = success
