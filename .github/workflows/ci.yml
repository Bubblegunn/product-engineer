name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - run: sh test/skill-structure.sh
      - run: sh test/commit-msg.test.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/check.test.mjs
