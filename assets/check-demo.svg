<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" font-family="SF Mono, Menlo, Consolas, monospace" font-size="13">
  <title>product-engineer check on a message without the block, then with it</title>
  <rect width="760" height="320" rx="8" fill="#111111"/>
  <circle cx="20" cy="18" r="5" fill="#3a3a3a"/><circle cx="36" cy="18" r="5" fill="#3a3a3a"/><circle cx="52" cy="18" r="5" fill="#3a3a3a"/>
  <g fill="#e8e8e8">
    <text x="20" y="52" fill="#9aa4ad">$ product-engineer check without-block.txt</text>
    <text x="20" y="72" fill="#f28b82">error no "For the customer:" block</text>
    <text x="20" y="92">1 error, 0 warnings</text>
    <text x="20" y="112" fill="#9aa4ad">exit 1</text>
    <text x="20" y="152" fill="#9aa4ad">$ product-engineer check with-block.txt</text>
    <text x="20" y="172" fill="#8fd18f">ok    "For the customer:" block with "What changed:"</text>
    <text x="20" y="192" fill="#8fd18f">ok    "Why it matters:" present</text>
    <text x="20" y="212" fill="#8fd18f">ok    "Automation effect:" present</text>
    <text x="20" y="232" fill="#9aa4ad">info  readability of the block: Flesch 75 (easy), LIX 30</text>
    <text x="20" y="252" fill="#8fd18f">ok    "Not shipped:" lists 1 item with reasons</text>
    <text x="20" y="272">no errors, 0 warnings</text>
    <text x="20" y="292" fill="#9aa4ad">exit 0</text>
  </g>
</svg>
